<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="c4_hex_grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <filter id="c4_shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0d9488" flood-opacity="0.3"/>
    </filter>
  </defs>

  

  <g filter="url(#c4_shadow)">
    <!-- Outer Hexagonal Frame -->
    <polygon points="256,72 416,164 416,348 256,440 96,348 96,164" fill="none" stroke="url(#c4_hex_grad1)" stroke-width="22" stroke-linejoin="round"/>

    <!-- Modern Stylized Interlocking Monogram: S - T - C with Dong Cross -->
    <!-- Top S/T fold -->
    <path d="M 176 170 L 336 170 L 336 240 L 176 272 L 176 342 L 336 342" fill="none" stroke="url(#c4_hex_grad1)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Central Vertical Pillar (Forming T and Currency Strike) -->
    <line x1="256" y1="126" x2="256" y2="386" stroke="#5eead4" stroke-width="16" stroke-linecap="round"/>

    <!-- Central Currency Node (Dong accent) -->
    <circle cx="256" cy="256" r="32" fill="#0f766e" stroke="#2dd4bf" stroke-width="4"/>
    <text x="256" y="271" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle">₫</text>
  </g>
</svg>