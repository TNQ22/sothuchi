<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="c1_cover_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="60%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#115e59" />
    </linearGradient>
    <linearGradient id="c1_accent_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="c1_coin_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5eead4" />
      <stop offset="50%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <filter id="c1_shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0d9488" flood-opacity="0.25"/>
    </filter>
    <filter id="c1_coin_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#14b8a6" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="116" fill="#ffffff"/>
       <rect width="512" height="512" rx="116" fill="none" stroke="#e2e8f0" stroke-width="2"/>

  <g filter="url(#c1_shadow)">
    <!-- Back page layer (depth effect) -->
    <rect x="144" y="88" width="248" height="336" rx="32" fill="#042f2e" opacity="0.35" />
    <rect x="138" y="82" width="250" height="338" rx="32" fill="#ccfbf1" opacity="0.9" />

    <!-- Ledger Main Cover -->
    <rect x="122" y="76" width="256" height="344" rx="32" fill="url(#c1_cover_grad)" stroke="#2dd4bf" stroke-width="3" stroke-opacity="0.5"/>
    
    <!-- Ledger Spine accent strip -->
    <rect x="122" y="76" width="46" height="344" rx="32" fill="#0f766e" />
    <rect x="146" y="76" width="22" height="344" fill="#0f766e" />
    <line x1="168" y1="76" x2="168" y2="420" stroke="#115e59" stroke-width="3" stroke-opacity="0.6"/>

    <!-- Binder rings / Spiral punch holes -->
    <circle cx="145" cy="120" r="7" fill="#f0fdfa"/>
    <circle cx="145" cy="180" r="7" fill="#f0fdfa"/>
    <circle cx="145" cy="240" r="7" fill="#f0fdfa"/>
    <circle cx="145" cy="300" r="7" fill="#f0fdfa"/>
    <circle cx="145" cy="360" r="7" fill="#f0fdfa"/>

    <!-- Upward Trend Chart Line across cover -->
    <path d="M 188 226 L 228 190 L 268 214 L 328 146" fill="none" stroke="#5eead4" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="326,134 346,146 336,164" fill="#5eead4"/>
    
    <!-- Chart accent points -->
    <circle cx="188" cy="226" r="5" fill="#ffffff"/>
    <circle cx="228" cy="190" r="5" fill="#ffffff"/>
    <circle cx="268" cy="214" r="5" fill="#ffffff"/>

    <!-- Bookmark Ribbon Hanging out of ledger -->
    <path d="M 314 76 L 314 132 L 328 120 L 342 132 L 342 76 Z" fill="url(#c1_accent_grad)"/>

    <!-- Central Vietnamese Dong Coin Badge -->
    <g filter="url(#c1_coin_glow)">
      <circle cx="274" cy="304" r="64" fill="url(#c1_coin_grad)" stroke="#ffffff" stroke-width="4"/>
      <circle cx="274" cy="304" r="52" fill="none" stroke="#99f6e4" stroke-width="2" stroke-dasharray="6,4"/>
      
      <!-- Dong Currency Symbol ₫ -->
      <text x="274" y="327" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="64" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-1">₫</text>
    </g>

    <!-- Small Sparkle / Growth Star -->
    <path d="M 334 234 Q 334 246 346 246 Q 334 246 334 258 Q 334 246 322 246 Q 334 246 334 234 Z" fill="#99f6e4"/>
  </g>
</svg>