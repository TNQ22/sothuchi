<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="c2_wallet_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="60%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="c2_coin_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5eead4" />
      <stop offset="50%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <linearGradient id="c2_orbit_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0.1" />
    </linearGradient>
    <filter id="c2_shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0d9488" flood-opacity="0.3"/>
    </filter>
  </defs>

  <linearGradient id="darkBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#darkBgGrad)"/>
  <rect width="512" height="512" rx="116" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <g transform="translate(51.2, 51.2) scale(0.8)" filter="url(#c2_shadow)">
    <!-- Dynamic Cashflow Orbit Ring around wallet -->
    <path d="M 120 220 A 160 160 0 1 1 392 220" fill="none" stroke="url(#c2_orbit_grad)" stroke-width="12" stroke-linecap="round"/>
    <circle cx="392" cy="220" r="10" fill="#2dd4bf" />
    <circle cx="120" cy="220" r="7" fill="#14b8a6" />

    <!-- Emerging Emerald Coin from top of wallet -->
    <g>
      <circle cx="256" cy="170" r="68" fill="url(#c2_coin_grad)" stroke="#ffffff" stroke-width="4"/>
      <circle cx="256" cy="170" r="54" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.6"/>
      <text x="256" y="194" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="70" font-weight="900" fill="#ffffff" text-anchor="middle">₫</text>
    </g>

    <!-- Main Wallet Body -->
    <rect x="96" y="206" width="320" height="216" rx="36" fill="url(#c2_wallet_grad)" stroke="#2dd4bf" stroke-width="2" stroke-opacity="0.4"/>
    
    <!-- Wallet Inner Fold / Card Slot -->
    <path d="M 96 246 Q 256 266 416 246" fill="none" stroke="#042f2e" stroke-width="4" opacity="0.3"/>
    <rect x="140" y="196" width="100" height="20" rx="8" fill="#5eead4" opacity="0.35"/>

    <!-- Wallet Clasp / Flap -->
    <path d="M 316 270 L 388 270 C 404 270 416 282 416 298 L 416 322 C 416 338 404 350 388 350 L 316 350 Z" fill="#0f766e" stroke="#2dd4bf" stroke-width="2.5"/>
    <circle cx="374" cy="310" r="12" fill="#5eead4" stroke="#ffffff" stroke-width="3"/>
  </g>
</svg>