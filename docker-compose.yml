services:
  sothuchi:
    image: ghcr.io/tnq22/sothuchi:latest
    container_name: sothuchi-sync-server
    restart: unless-stopped
    ports:
      # Cổng trên máy chủ : Cổng trong container (Đọc PORT từ .env nếu có, mặc định 8081)
      - "${PORT:-8081}:8081"
    environment:
      - PORT=8081
      - HOST=0.0.0.0
      - DATA_DIR=/app/data
      # Múi giờ container (quan trọng cho log server & xử lý ngày tháng phía server)
      # Người dùng ở Việt Nam: Asia/Ho_Chi_Minh | Thái Lan: Asia/Bangkok | Singapore: Asia/Singapore
      # Danh sách đầy đủ: https://en.wikipedia.org/wiki/List_of_tz_database_time_zones
      - TZ=${TZ:-Asia/Ho_Chi_Minh}
      # User ID & Group ID của máy chủ host (mặc định 1000, giúp tự động khớp quyền thư mục volume)
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      # Khóa bí mật JWT (Đọc JWT_SECRET từ .env nếu có)
      - JWT_SECRET=${JWT_SECRET:-sothuchi_super_secure_vault_secret_key_change_me_12345}
      # --- EMAIL QUẢN TRỊ VIÊN MÁY CHỦ SAO LƯU (ADMIN DASHBOARD /admin) ---
      # Khai báo Email có quyền Quản trị (ngăn cách bằng dấu phẩy nếu có nhiều email)
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - ADMIN_EMAILS=${ADMIN_EMAILS:-${ADMIN_EMAIL:-}}
      # Google Client ID cho Backend Máy chủ & cấp sẵn cho Client PWA
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      # Google API Key cho Google Picker (duyệt tệp chia sẻ)
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      # Tên miền cho phép kết nối CORS (Đọc CORS_ORIGIN từ .env nếu có, mặc định *)
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      # --- CẤU HÌNH CẤP SẴN CHO CLIENT PWA (NGƯỜI DÙNG TỰ DO CHỌN DRIVE / DROPBOX) ---
      - GOOGLE_STORAGE_LOCATION=${GOOGLE_STORAGE_LOCATION:-appDataFolder}
      - GOOGLE_CUSTOM_FOLDER_NAME=${GOOGLE_CUSTOM_FOLDER_NAME:-Sổ Thu Chi}
      # Quyền hạn Google Drive: 'false' (Mặc định: drive.file an toàn tối đa) hoặc 'true' (drive: toàn quyền, tự động đọc mọi file chia sẻ)
      - GOOGLE_DRIVE_FULL_ACCESS=${GOOGLE_DRIVE_FULL_ACCESS:-false}
      - GOOGLE_WORKER_URL=${GOOGLE_WORKER_URL:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - DROPBOX_APP_KEY=${DROPBOX_APP_KEY:-}
      - AUTO_SYNC_ENABLED=${AUTO_SYNC_ENABLED:-true}
      # --- NHẬN DIỆN HOÁ ĐƠN THÔNG MINH BẰNG AI (CLOUDFLARE WORKERS AI / GEMINI) ---
      # OCR_ENGINE: 'cloudflare' (Khuyên dùng: Llama 3.2 Vision) | 'gemini' (Gemini 1.5 Flash) | 'offline' (Tesseract.js)
      - OCR_ENGINE=${OCR_ENGINE:-cloudflare}
      # Bật/tắt AI Vision và cấu hình thời gian chờ chuyển sang Tesseract OCR (giây)
      - OCR_AI_ENABLED=${OCR_AI_ENABLED:-true}
      - OCR_AI_TIMEOUT=${OCR_AI_TIMEOUT:-8}
      - CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID:-}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      # Lưu trữ cơ sở dữ liệu SQLite và bản sao lưu bền vững trên máy chủ
      # Lưu ý: Nếu dùng biến môi trường, hãy đảm bảo đúng chính tả CONTAINER_DATA (với chữ N)
      - ${CONTAINER_DATA:-.}/SoThuChi/data:/app/data
